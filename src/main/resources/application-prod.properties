# The hosting platform terminates public HTTPS. The container is reachable only via its proxy.
server.address=0.0.0.0
server.port=${PORT:8080}
server.ssl.enabled=false
server.forward-headers-strategy=framework
server.tomcat.redirect-context-root=false
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
videoquiz.data-dir=${VIDEOQUIZ_DATA_DIR}
videoquiz.total-storage-bytes=${VIDEOQUIZ_TOTAL_STORAGE_BYTES:419430400}
videoquiz.storage-reserve-bytes=${VIDEOQUIZ_STORAGE_RESERVE_BYTES:67108864}
videoquiz.max-accounts=${VIDEOQUIZ_MAX_ACCOUNTS:100}
videoquiz.analysis-per-user-hour=${VIDEOQUIZ_ANALYSIS_PER_USER_HOUR:6}
videoquiz.analysis-per-hour=${VIDEOQUIZ_ANALYSIS_PER_HOUR:30}
