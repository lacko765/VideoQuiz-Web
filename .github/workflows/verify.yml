
name: Verify VideoQuiz
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: videoquiz
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: videoquiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U videoquiz"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp verify
        env:
          VIDEOQUIZ_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/videoquiz?user=videoquiz&password=ci-fixture-only

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: .tools/ui-artifacts
          include-hidden-files: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t videoquiz:verify .
