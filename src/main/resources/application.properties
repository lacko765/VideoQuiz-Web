spring.profiles.default=local
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
# The top-level Google callback must carry the session holding OAuth state/nonce.
# CSRF tokens still protect every application mutation.
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=16KB
server.tomcat.connection-timeout=5s
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
videoquiz.data-dir=${VIDEOQUIZ_DATA_DIR:./data}
videoquiz.key-encryption-key=${VIDEOQUIZ_KEY_ENCRYPTION_KEY:}
videoquiz.google-client-id=${VIDEOQUIZ_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
videoquiz.google-client-secret=${VIDEOQUIZ_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
videoquiz.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}
videoquiz.youtube-api-timeout-ms=${VIDEOQUIZ_YOUTUBE_API_TIMEOUT_MS:60000}
videoquiz.youtube-player-timeout-ms=${VIDEOQUIZ_YOUTUBE_PLAYER_TIMEOUT_MS:60000}
videoquiz.youtube-metadata-timeout-ms=${VIDEOQUIZ_YOUTUBE_METADATA_TIMEOUT_MS:60000}
