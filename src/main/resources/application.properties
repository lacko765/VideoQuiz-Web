server.address=${VIDEOQUIZ_BIND:127.0.0.1}
server.port=${VIDEOQUIZ_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${VIDEOQUIZ_TLS_KEYSTORE:file:./config/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${VIDEOQUIZ_TLS_PASSWORD}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=16KB
server.tomcat.connection-timeout=5s
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
videoquiz.data-dir=${VIDEOQUIZ_DATA_DIR:./data}
videoquiz.gemini-key=${GEMINI_API_KEY:}
videoquiz.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}
