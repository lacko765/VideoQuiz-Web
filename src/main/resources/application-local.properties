# Default for NetBeans and Easy Setup. Never loaded with the prod profile.
server.address=${VIDEOQUIZ_BIND:127.0.0.1}
server.port=${VIDEOQUIZ_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${VIDEOQUIZ_TLS_KEYSTORE:file:./config/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${VIDEOQUIZ_TLS_PASSWORD}
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.forward-headers-strategy=none
